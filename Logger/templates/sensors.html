<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Manage Sensors</title>
        <link rel="stylesheet" href="/static/css/style.css">
    </head>

    <body>
        <div class="container">
            <h1>Manage Sensors</h1>
            <div class="form-section">
                <h2 id="form-title">Add New Sensor</h2>
                <form id="sensor-form">
                    <div class="form-row">
                        <label for="sensor-id">Sensor ID:</label>
                        <input type="number" id="sensor-id" min="0" required>
                        <label for="sensor-name">Name:</label>
                        <input type="text" id="sensor-name" required maxlength="100">
                        <button type="submit" id="form-submit-btn">Add Sensor</button>
                        <button type="button" id="cancel-edit-btn" style="display:none;">Cancel</button>
                    </div>
                </form>
            </div>
    
            <div class="table-section">
                <h2>Existing Sensors</h2>
                <table id="sensors-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
  
        <script src="/static/js/sensors.js"></script>
    </body>
</html>
