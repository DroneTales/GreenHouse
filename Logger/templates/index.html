<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Greenhouse Monitor</title>
        <link rel="stylesheet" href="/static/css/style.css">
    </head>

    <body>
        <div class="container">
            <h1>Greenhouse Temperature History</h1>
    
            <div class="controls">
                <div class="date-range">
                    <label for="start-date">Start:</label>
                    <input type="date" id="start-date">
                    <label for="end-date">End:</label>
                    <input type="date" id="end-date">
                    <button id="apply-btn">Apply</button>
                </div>

                <div class="presets">
                    <button id="24h-btn">Last 24</button>
                    <button id="today-btn">Today</button>
                    <button id="week-btn">Last week</button>
                    <button id="month-btn">Last month</button>
                </div>

                <div id="toggleable-sensors" class="sensor-toggles"></div>
            </div>
            
            <div class="chart-container">
                <canvas id="sensorChart"></canvas>
            </div>
        </div>

        <div id="range-label" class="range-label">24 hours</div>

        <script src="/static/js/date-adapter.js"></script>
        <script src="/static/js/chart.js"></script>
        <script src="/static/js/app.js"></script>
    </body>
</html>
